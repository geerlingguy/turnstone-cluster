---
name: CI

'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Ansible and ansible-lint.
        run: pip3 install ansible ansible-lint

      - name: Use example inventory and config.
        run: |
          cp example.hosts.ini hosts.ini
          cp example.config.yml config.yml

      - name: Run ansible-lint.
        shell: bash {0}
        run: |
          for c in "python3 --version" "ansible --version" "ansible-lint --version" "ansible-lint"; do
            $c > out.log 2>&1; rc=$?
            echo "::warning::[$c] rc=$rc"
            tail -25 out.log | while IFS= read -r l; do echo "::warning::$l"; done
          done
          exit 1
