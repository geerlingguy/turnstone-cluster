---
# SSH: keys only, no root. A drop-in, since drop-ins override sshd_config.
- name: Make sure the SSH user has an authorized key before disabling passwords.
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/authorized_keys"
  register: security_authorized_keys

- name: Fail if there's no authorized key (password login is about to be disabled).
  ansible.builtin.assert:
    that: security_authorized_keys.stat.exists and security_authorized_keys.stat.size > 0
    fail_msg: "Add your SSH key first: ssh-copy-id {{ ansible_user | default('user') }}@{{ inventory_hostname }}"

- name: Lock down SSH authentication.
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-security.conf
    content: |
      # Managed by Ansible (turnstone-cluster).
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH
  become: true

- name: Check the effective SSH configuration.
  ansible.builtin.command: /usr/sbin/sshd -T
  register: security_sshd_config
  changed_when: false
  become: true

- name: Verify password and root login are disabled.
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in security_sshd_config.stdout_lines"
      - "'kbdinteractiveauthentication no' in security_sshd_config.stdout_lines"
      - "'permitrootlogin no' in security_sshd_config.stdout_lines"
    quiet: true

# Automatic security updates on Fedora (dnf5).
- name: Set up automatic security updates (dnf5).
  when: ansible_facts['os_family'] == 'RedHat'
  become: true
  block:
    - name: Install dnf-automatic.
      ansible.builtin.dnf:
        name: dnf-automatic
        state: present

    - name: Configure dnf-automatic to apply security updates.
      community.general.ini_file:
        path: /etc/dnf/automatic.conf
        section: commands
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        mode: "0644"
      loop:
        - { key: upgrade_type, value: security }
        - { key: apply_updates, value: "yes" }

    - name: Enable the dnf-automatic timer.
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        state: started
        enabled: true

# Firewall: SSH and mDNS from anywhere; everything else from allowed networks only.
- name: Determine which ports this host serves to the LAN.
  ansible.builtin.set_fact:
    security_lan_tcp_ports: >-
      {{ [9100]
         + ([9835] if llm_gpu_vendor == 'nvidia' else [])
         + ([llm_port] if llm_runtime | default('') == 'llama-cpp' else [])
         + firewall_extra_tcp_ports }}
    # Containers reaching services on their own host (e.g. Prometheus scraping node_exporter).
    security_source_networks: >-
      {{ firewall_allowed_networks
         + (['172.16.0.0/12'] if ansible_facts['docker0'] is defined else []) }}

- name: Configure ufw.
  ansible.builtin.include_tasks: firewall-ufw.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Configure firewalld.
  ansible.builtin.include_tasks: firewall-firewalld.yml
  when: ansible_facts['os_family'] == 'RedHat'
