---
# vLLM in Docker, for the NVIDIA GB10s (DGX OS).
- name: Ensure the LLM compose directory exists.
  ansible.builtin.file:
    path: "{{ llm_docker_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Configure the vLLM container.
  ansible.builtin.template:
    src: templates/llm-compose.yml.j2
    dest: "{{ llm_docker_dir }}/compose.yml"
    mode: "0600"
  become: true

- name: Start the vLLM container.
  community.docker.docker_compose_v2:
    project_src: "{{ llm_docker_dir }}"
    pull: missing
    state: present
  become: true
