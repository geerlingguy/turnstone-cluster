---
- name: Install ufw.
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

# Docker-published ports bypass ufw's INPUT rules; DOCKER-USER filters them.
- name: Restrict Docker-published ports to the allowed networks.
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED: DOCKER-USER"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      {% for net in firewall_allowed_networks %}
      -A DOCKER-USER -i {{ ansible_facts['default_ipv4']['interface'] }} -s {{ net }} -j RETURN
      {% endfor %}
      -A DOCKER-USER -i {{ ansible_facts['default_ipv4']['interface'] }} -j DROP
      -A DOCKER-USER -j RETURN
      COMMIT
  notify: Reload ufw
  become: true

- name: Allow SSH and mDNS from anywhere.
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "22", proto: tcp }
    - { port: "5353", proto: udp }
  become: true

- name: Allow LAN service ports from the allowed networks.
  community.general.ufw:
    rule: allow
    port: "{{ item[1] | string }}"
    proto: tcp
    from_ip: "{{ item[0] }}"
  loop: "{{ security_source_networks | product(security_lan_tcp_ports) | list }}"
  become: true

- name: Enable ufw, denying everything else.
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
  become: true
