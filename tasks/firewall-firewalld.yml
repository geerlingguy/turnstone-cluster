---
# Fedora Workstation's default zone allows all ports above 1024.
- name: Get the default firewalld zone.
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: security_default_zone
  changed_when: false
  become: true

- name: Use the 'public' zone by default.
  ansible.builtin.command: firewall-cmd --set-default-zone=public
  when: security_default_zone.stdout != 'public'
  changed_when: true
  become: true

- name: Allow SSH and mDNS from anywhere.
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - ssh
    - mdns
  become: true

- name: Allow LAN service ports from the allowed networks.
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family=ipv4 source address={{ item[0] }}
      port port={{ item[1] }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ security_source_networks | product(security_lan_tcp_ports) | list }}"
  become: true
