---
# Copy to config.yml (which is ignored by git) and adjust as needed.
# Defaults for everything else are in group_vars/all.yml.

# Optional shared API key for every LLM server. If set, also enter it as the
# API key for each model in Turnstone. Generate one with: openssl rand -hex 24
llm_api_key: ""

# Optional Hugging Face token, for faster and higher-limit model downloads.
hf_token: ""

# Your LAN. Only allowed networks can reach the LLM servers, Turnstone, Grafana,
# and exporters; SSH is open to all (keys only).
llm_allowed_network: 10.0.2.0/24

# Add other networks (e.g. a VPN subnet) that need access.
# firewall_allowed_networks:
#   - "{{ llm_allowed_network }}"
#   - 192.168.10.0/24

# Turnstone release to check out (https://github.com/turnstonelabs/turnstone/releases).
turnstone_version: v1.9.1

# Grafana admin password (the dashboard itself is viewable without logging in).
# Leave empty to use Grafana's default (admin/admin, changed at first login).
grafana_admin_password: ""
