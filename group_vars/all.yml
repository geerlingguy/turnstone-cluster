---
# Defaults for every host. Override secrets and site settings in config.yml,
# and per-node model settings in host_vars/.

# Turnstone (the 'turnstone' group).
turnstone_version: v1.9.1
turnstone_install_dir: "{{ ansible_facts['user_dir'] }}/turnstone"
turnstone_workspace_dir: "{{ ansible_facts['user_dir'] }}/turnstone-workspace"
turnstone_https_port: 443
turnstone_node_count: 1

# LLM servers (the 'ai_nodes' group).
llm_api_key: ""
llm_port: 8000
llm_max_concurrency: 0
llm_wait_for_health: true
llm_health_timeout_minutes: 60
llm_allowed_network: 10.0.2.0/24
llm_health_path: /health
llm_supports_api_key: true
llm_hf_venv: "{{ ansible_facts['user_dir'] }}/.local/share/hf-cli"
llm_host_dirs: []
llm_metrics_type: vllm  # vllm, llamacpp, or radiance (for monitoring).

# LLM server in Docker (llm_runtime: docker).
llm_install_docker: false  # DGX OS ships with Docker.
llm_gpu_vendor: nvidia  # nvidia or amd.
llm_docker_dir: /opt/llm
llm_shm_size: ""
llm_container_name: vllm
llm_container_port: 8000
llm_container_env: {}
llm_container_command: []
llm_container_volumes: []
llm_named_volumes: []

# llama.cpp (llm_runtime: llama-cpp).
llama_cpp_version: b12015
llama_cpp_src_dir: "{{ ansible_facts['user_dir'] }}/llama.cpp"
llm_model_dir: "{{ ansible_facts['user_dir'] }}/models"
llm_mmproj_file: ""
llm_ttm_pages: 32505856  # ~124 GiB of 4 KiB pages.

# Monitoring (Prometheus + Grafana on the Turnstone node).
monitoring_dir: /opt/monitoring
monitoring_grafana_port: 3000
monitoring_retention: 30d
monitoring_scrape_interval: 15s
monitoring_turnstone_network: turnstone_turnstone-net
monitoring_hosts: "{{ groups['ai_nodes'] + (groups['turnstone'] | difference(groups['ai_nodes'])) }}"
monitoring_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
monitoring_prometheus_image: prom/prometheus:v3.15.1
monitoring_grafana_image: grafana/grafana:13.3.0
monitoring_json_exporter_image: quay.io/prometheuscommunity/json-exporter:v0.8.0
node_exporter_version: 1.12.1
nvidia_gpu_exporter_version: 1.16.0
# Only what the dashboard uses; some default collectors (e.g. filesystem on a
# stale mount) can hang a scrape.
node_exporter_collectors:
  - cpu
  - meminfo
  - hwmon
  - drm
  - loadavg
  - netdev
  - uname
node_exporter_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version
  }}/node_exporter-{{ node_exporter_version }}.linux-{{ monitoring_arch }}.tar.gz
nvidia_gpu_exporter_url: >-
  https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v{{ nvidia_gpu_exporter_version
  }}/nvidia_gpu_exporter_{{ nvidia_gpu_exporter_version }}_linux_{{ 'arm64' if monitoring_arch == 'arm64' else 'x86_64' }}.tar.gz
grafana_admin_password: ""

# Security (geerlingguy.security).
# GPU driver updates break running GPU workloads until a reboot.
security_autoupdate_blacklist:
  - ".*nvidia"
  - ".*cuda"
# Firewall (geerlingguy.firewall). SSH and mDNS are open to all; LLM, exporter,
# Turnstone, and Grafana ports only to firewall_allowed_networks.
firewall_allowed_networks:
  - "{{ llm_allowed_network }}"
firewall_extra_tcp_ports: []
firewall_allowed_tcp_ports:
  - "22"
firewall_allowed_udp_ports:
  - "5353"
firewall_disable_firewalld: true
firewall_disable_ufw: true
# Docker manages its own iptables rules.
firewall_flush_rules_and_chains: false
firewall_docker_host: "{{ llm_runtime | default('') == 'docker' or inventory_hostname in groups['turnstone'] }}"
firewall_lan_tcp_ports: >-
  {{ [9100]
     + ([9835] if llm_gpu_vendor == 'nvidia' else [])
     + ([llm_port] if llm_runtime | default('') == 'llama-cpp' else [])
     + firewall_extra_tcp_ports }}
# Includes Docker's networks, so containers can reach services on their own host.
firewall_lan_networks: "{{ firewall_allowed_networks + (['172.16.0.0/12'] if firewall_docker_host else []) }}"
firewall_lan_rules: >-
  {{ firewall_lan_networks | product(firewall_lan_tcp_ports)
     | map('join', ' -p tcp --dport ')
     | map('regex_replace', '^', 'iptables -A INPUT -s ')
     | map('regex_replace', '$', ' -j ACCEPT') | list }}
# Docker-published ports bypass INPUT; DOCKER-USER limits them to the allowed networks.
# The role's script sets FORWARD to ACCEPT; Docker hosts shouldn't route other traffic.
firewall_docker_rules: >-
  {{ (['iptables -P FORWARD DROP',
       'iptables -N DOCKER-USER 2>/dev/null || true',
       'iptables -F DOCKER-USER',
       'iptables -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN']
      + (firewall_allowed_networks
         | map('regex_replace', '^', 'iptables -A DOCKER-USER -i ' ~ ansible_facts['default_ipv4']['interface'] ~ ' -s ')
         | map('regex_replace', '$', ' -j RETURN') | list)
      + ['iptables -A DOCKER-USER -i ' ~ ansible_facts['default_ipv4']['interface'] ~ ' -j DROP'])
     if firewall_docker_host else [] }}
firewall_additional_rules: "{{ firewall_lan_rules + firewall_docker_rules }}"
