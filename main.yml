---
- name: Turnstone node
  hosts: turnstone
  vars_files:
    - config.yml

  tasks:
    - name: Ensure Turnstone dependencies are installed.
      ansible.builtin.apt:
        name:
          - git
          - openssl
        state: present
      become: true

    - name: Ensure the Turnstone workspace directory exists.
      ansible.builtin.file:
        path: "{{ turnstone_workspace_dir }}"
        state: directory
        mode: "0755"

    - name: Check out Turnstone.
      ansible.builtin.git:
        repo: https://github.com/turnstonelabs/turnstone.git
        dest: "{{ turnstone_install_dir }}"
        version: "{{ turnstone_version }}"
      register: turnstone_git
      environment:
        GIT_LFS_SKIP_SMUDGE: "1"

    # Secrets are only generated the first time; an existing .env (e.g. one
    # written by Turnstone's run.sh installer) is never overwritten.
    - name: Generate Turnstone secrets (first run only).
      ansible.builtin.copy:
        dest: "{{ turnstone_install_dir }}/.env"
        content: |
          # Generated by Ansible - keep this private.
          TURNSTONE_JWT_SECRET={{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}
          POSTGRES_USER=turnstone
          POSTGRES_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=36) | lower }}
          TURNSTONE_HOST_IP=127.0.0.1
          POSTGRES_PORT=5432
        mode: "0600"
        force: false

    - name: Configure Turnstone port and workspace mount.
      ansible.builtin.lineinfile:
        path: "{{ turnstone_install_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: CONSOLE_HTTPS_PORT, value: "{{ turnstone_https_port }}" }
        - { key: WORKSPACE_MOUNT, value: "{{ turnstone_workspace_dir }}" }
      register: turnstone_env

    - name: Configure the number of Turnstone nodes.
      ansible.builtin.template:
        src: templates/turnstone-compose.override.yaml.j2
        dest: "{{ turnstone_install_dir }}/compose.override.yaml"
        mode: "0644"
      register: turnstone_override

    - name: Build and start Turnstone.
      community.docker.docker_compose_v2:
        project_src: "{{ turnstone_install_dir }}"
        build: "{{ 'always' if turnstone_git is changed else 'policy' }}"
        recreate: "{{ 'always' if (turnstone_env is changed or turnstone_override is changed) else 'auto' }}"
        remove_orphans: true
        state: present
      become: true

    - name: Wait for the Turnstone dashboard to respond.
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ turnstone_https_port }}/"
        validate_certs: false
      register: turnstone_dashboard
      until: turnstone_dashboard.status == 200
      retries: 30
      delay: 10

- name: AI nodes
  hosts: ai_nodes
  vars_files:
    - config.yml

  handlers:
    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 900
      become: true

    - name: Restart llama-server
      ansible.builtin.systemd_service:
        name: llama-server
        state: restarted
        daemon_reload: true
      become: true

  tasks:
    - name: Download model weights.
      ansible.builtin.include_tasks: tasks/model-download.yml
      when: llm_hf_repo is defined

    - name: Set up the LLM server for this node.
      ansible.builtin.include_tasks: "tasks/llm-{{ llm_runtime }}.yml"

    - name: Wait for the LLM server to be healthy (first start can take 30+ min).
      ansible.builtin.uri:
        url: "http://localhost:{{ llm_port }}{{ llm_health_path }}"
        headers: "{{ {'Authorization': 'Bearer ' ~ llm_api_key} if llm_api_key else {} }}"
      register: llm_health
      until: llm_health.status == 200
      retries: "{{ (llm_health_timeout_minutes * 4) | int }}"
      delay: 15
      when: llm_wait_for_health | bool

    - name: Get the model ID the server reports.
      ansible.builtin.uri:
        url: "http://localhost:{{ llm_port }}/v1/models"
        headers: "{{ {'Authorization': 'Bearer ' ~ llm_api_key} if llm_api_key else {} }}"
      register: llm_models
      failed_when: false
      no_log: "{{ llm_api_key | length > 0 }}"

    - name: Print the Turnstone model settings for this node.
      ansible.builtin.debug:
        msg:
          - "Alias: {{ llm_model_name }}"
          - "Model ID: {{ llm_models.json.data[0].id | default('unknown - check /v1/models') }}"
          # Turnstone's containers can't resolve mDNS (.local) names, so use the IP.
          - "Base URL: http://{{ ansible_facts['default_ipv4']['address'] | default(inventory_hostname) }}:{{ llm_port }}/v1"
          - "API key: {{ 'see config.yml (llm_api_key)' if llm_api_key else 'none' }}"
          - "Max concurrent generations: {{ llm_max_concurrency }}"

- name: Monitoring
  hosts: ai_nodes:turnstone
  vars_files:
    - config.yml

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: restarted
        daemon_reload: true
      become: true

    - name: Restart nvidia_gpu_exporter
      ansible.builtin.systemd_service:
        name: nvidia_gpu_exporter
        state: restarted
        daemon_reload: true
      become: true

    - name: Restart monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: restarted
      become: true

  tasks:
    - name: Set up metrics exporters.
      ansible.builtin.include_tasks: tasks/monitoring-exporters.yml

    - name: Set up Prometheus and Grafana.
      ansible.builtin.include_tasks: tasks/monitoring-dashboard.yml
      when: inventory_hostname in groups['turnstone']
